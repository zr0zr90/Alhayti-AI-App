name: Build Alhayti AI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'alhayti-ai-app-complete.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract the app source
        run: unzip -q alhayti-ai-app-complete.zip -d source

      - name: Build APK
        working-directory: source/android
        run: gradle --no-daemon assembleDebug

      - name: Publish APK file
        uses: android-actions/setup-android@v4
        with:
          name: Alhayti-AI-Android-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
